services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "11"
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006          # Default Web VNC (Needed for initial setup)
      # Sunshine Ports
      - 47984-47990:47984-47990/tcp
      - 47998-48000:47998-48000/udp
      - 48010:48010/tcp
      - 48010:48010/udp
    volumes:
      - /home/user/win_data:/storage
    stop_grace_period: 2m
    restart: on-failure
    
